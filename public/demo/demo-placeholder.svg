<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
  <title id="t">Démo provisoire de LiveSubtitles</title>
  <desc id="d">Image de remplacement : une scène de stream fictive où trois sous-titres apparaissent puis s'effacent l'un après l'autre.</desc>
  <style>
    text { font-family: "Segoe UI", system-ui, sans-serif; }
    .sub { opacity: 0; animation: show 12s infinite; }
    .s2 { animation-delay: 4s; }
    .s3 { animation-delay: 8s; }
    @keyframes show {
      0%, 4% { opacity: 0; }
      8%, 26% { opacity: 1; }
      31%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sub { animation: none; }
      .s1 { opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2440"/>
      <stop offset="1" stop-color="#0d1220"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- faux cadre de webcam -->
  <rect x="1380" y="60" width="480" height="270" rx="16" fill="#263156" stroke="#44528a" stroke-width="4"/>
  <circle cx="1620" cy="165" r="48" fill="#44528a"/>
  <path d="M1530 330a90 80 0 0 1 180 0z" fill="#44528a"/>
  <!-- mention provisoire -->
  <rect x="60" y="60" width="520" height="84" rx="12" fill="#f5b942"/>
  <text x="320" y="117" font-size="44" font-weight="700" text-anchor="middle" fill="#1b1400">DÉMO PROVISOIRE</text>
  <text x="960" y="520" font-size="56" text-anchor="middle" fill="#5f6da3">La vidéo de démonstration viendra ici</text>
  <!-- sous-titres -->
  <g class="sub s1">
    <rect x="460" y="880" width="1000" height="110" rx="14" fill="#000" fill-opacity=".7"/>
    <text x="960" y="952" font-size="54" text-anchor="middle" fill="#fff">Hello everyone, welcome to the stream!</text>
  </g>
  <g class="sub s2">
    <rect x="410" y="880" width="1100" height="110" rx="14" fill="#000" fill-opacity=".7"/>
    <text x="960" y="952" font-size="54" text-anchor="middle" fill="#fff">Today we are starting a brand new game.</text>
  </g>
  <g class="sub s3">
    <rect x="510" y="880" width="900" height="110" rx="14" fill="#000" fill-opacity=".7"/>
    <text x="960" y="952" font-size="54" text-anchor="middle" fill="#fff">Thank you for being here tonight.</text>
  </g>
</svg>
